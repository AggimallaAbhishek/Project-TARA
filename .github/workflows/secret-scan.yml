name: Secret scan

# This repository is public. A single pushed credential is a disclosed
# credential, so this runs on every push and PR and is the backstop for the
# local .githooks/pre-commit hook (which `git commit --no-verify` can skip and
# a fresh clone does not install at all).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-scan:
    name: In-repo scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Path + content checks over every tracked file. Same script the
      # pre-commit hook runs, so local and CI verdicts cannot drift.
      - name: Scan tracked files
        run: ./scripts/secret-scan.sh --tracked

      # Guard the guard: if the ignore rules ever stop covering the real env
      # files, the scanner's path check is the only thing left standing.
      - name: Assert env files are ignored
        run: |
          set -euo pipefail
          for f in .env .env.docker backend/.env frontend/.env; do
            if ! git check-ignore -q "$f"; then
              echo "::error::$f is NOT gitignored - it could be committed."
              exit 1
            fi
          done
          echo "All environment files are ignored."

  gitleaks:
    name: Gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still readable
          # in the earlier one, so scanning only the tip would miss it.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
